    <!-- Google Fonts for judicial editorial styling: Newsreader & Plus Jakarta Sans & JetBrains Mono -->

    <!-- Structured Data (Schema.org JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "GovernmentOrganization",
      "name": "Ogun State Judiciary Law Library",
      "alternateName": "OGS Judiciary Library",
      "url": "https://ogunstatelawlibrary.gov.ng",
      "description": "Official legal and judicial repository of the High Court of Justice and Judiciary of Ogun State, Nigeria.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Judiciary Headquarters, Kobape Road",
        "addressLocality": "Abeokuta",
        "addressRegion": "Ogun State",
        "addressCountry": "NG"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://ogunstatelawlibrary.gov.ng/catalog?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
